<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atención al Cliente | Naranja X</title>
  <style>
    :root {
      --orange-brand: #ff5000;
      --purple-brand: #5d00a8;
      --purple-hover: #480082;
      --text-dark: #222222;
      --text-muted: #555555;
      --bg-gray: #f9fafb;
      --border-light: #eeeeee;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-dark);
      background-color: #ffffff;
      line-height: 1.4;
    }

    /* Header Navbar */
    header {
      height: 60px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      background: #ffffff;
      z-index: 100;
    }

    .hamburger-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #333;
      padding: 4px;
      margin-right: 16px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--orange-brand);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .logo span {
      color: var(--purple-brand);
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Hero Section */
    .hero {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 40px;
    }

    /* Orden en móvil: La imagen arriba del texto */
    .hero-img {
      order: 1;
      width: 100%;
    }

    .hero-img img {
      width: 100%;
      max-width: 450px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    .hero-text {
      order: 2;
    }

    .hero-text h1 {
      font-size: 28px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
      color: #111111;
      letter-spacing: -0.5px;
    }

    .hero-text p {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.45;
    }

    .btn-purple {
      display: block;
      width: 100%;
      text-align: center;
      padding: 14px 20px;
      background-color: var(--purple-brand);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      border-radius: 12px;
      transition: background-color 0.2s;
    }

    .btn-purple:hover {
      background-color: var(--purple-hover);
    }

    /* Tarjetas de Accesos Rápidos */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      margin-bottom: 40px;
    }

    .card-item {
      border: 1px solid var(--border-light);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .card-title svg {
      color: var(--purple-brand);
    }

    .card-item p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 20px;
      flex-grow: 1;
    }

    .btn-outline-purple {
      display: inline-block;
      width: fit-content;
      padding: 8px 20px;
      background: transparent;
      color: var(--purple-brand);
      border: 1.5px solid var(--purple-brand);
      border-radius: 20px;
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
      transition: all 0.2s;
    }

    .btn-outline-purple:hover {
      background-color: var(--purple-brand);
      color: #ffffff;
    }

    /* Versión Desktop / Pantallas grandes */
    @media (min-width: 768px) {
      .hero {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 40px;
      }
      .hero-text {
        order: 1;
      }
      .hero-img {
        order: 2;
      }
      .hero-text h1 {
        font-size: 38px;
      }
      .btn-purple {
        display: inline-block;
        width: auto;
        padding: 12px 32px;
        border-radius: 30px;
      }
      .cards-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>

  <header>
    <button class="hamburger-btn" aria-label="Menú">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <a href="#" class="logo">Naranja<span>X</span></a>
  </header>

  <div class="container">

    <!-- Hero Section -->
    <section class="hero">
      <div class="hero-img">
        <img src="image-canales-ayuda.jpg" alt="Atención al cliente Naranja X">
      </div>
      <div class="hero-text">
        <h1>Gestioná tu consulta desde la app</h1>
        <p>Ingresá a Ayuda, cargá tu consulta y hacé seguimiento de tu caso de forma simple y rápida desde la app Naranja X.</p>
        <a href="#" class="btn-purple">Descargar app</a>
      </div>
    </section>

    <!-- Tarjetas de Canales -->
    <section class="cards-grid">
      <div class="card-item">
        <div>
          <div class="card-title">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            Chat online
          </div>
          <p>Obtené respuestas rápidas interactuando con el asistente virtual de Naranja X.</p>
        </div>
      </div>
    </section>

  </div>

</body>
</html>
